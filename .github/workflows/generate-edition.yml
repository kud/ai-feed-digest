name: Generate daily edition

# Generates the daily briefing on your Claude Max plan (no API token) via the
# Claude Code CLI, then commits the edition so Vercel redeploys to publish it.
#
# Prerequisite: add a repository secret CLAUDE_CODE_OAUTH_TOKEN, generated locally
# with `claude setup-token` (uses your Max login). That is what authenticates
# `claude -p` here — no ANTHROPIC_API_KEY involved.

on:
  schedule:
    # 16:00 UTC ≈ 18:00 Europe/Paris in summer (CEST) / 17:00 in winter (CET).
    # GitHub cron is UTC and does not follow DST — shift this if the hour matters.
    - cron: "0 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: generate-edition
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate edition
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NODE_ENV: production
        run: npm run generate:edition

      - name: Commit new edition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A content
          if git diff --cached --quiet; then
            echo "No new edition to commit."
          else
            git commit -m "📰 chore(edition): daily briefing $(date -u +%F)"
            git push
          fi
